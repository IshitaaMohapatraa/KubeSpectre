version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: spectre-redis
    ports:
      - "6379:6379"

  spectre-guard:
    build:
      context: ./spectre-guard
      dockerfile: Dockerfile
    container_name: spectre-guard
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis